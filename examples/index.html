<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Device Detector Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header>
    <h1>Wheel Device Detector</h1>
    <p class="subtitle">Interactive demo to distinguish Mouse Wheel vs Trackpad input</p>
  </header>

  <div class="container">
    <!-- Interactive Area -->
    <div class="card">
      <h2>Test Area</h2>
      <div id="scrollTarget" class="scroll-area">
        <p><strong>Scroll / Wheel over this box</strong></p>
      </div>

      <div class="controls">
        <label class="checkbox-label">
          <input type="checkbox" id="autoResetCheckbox" checked>
          Auto-reset state after 3 seconds of inactivity
        </label>
        <button id="resetBtn" class="btn" style="background: #991b1b;">Reset State</button>
      </div>
    </div>

    <!-- Output Display -->
    <div class="card">
      <h2>Detector Output</h2>

      <div style="text-align: center; margin-top: 1rem;">
        <div id="deviceBadge" class="result-badge unknown">
          <span id="deviceText">unknown</span>
        </div>
      </div>

      <h3 style="font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--muted);">Classifier Metrics & Inference Rules</h3>
      <div id="rulesList" class="rules-list">
        <div class="empty-rules">No wheel events received yet</div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
