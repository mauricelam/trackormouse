<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Device Detector Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Wheel Device Detector</h1>
    <p class="subtitle">Interactive demo to distinguish Mouse Wheel vs Trackpad input</p>
  </header>

  <div class="container">
    <!-- Test & Control Area -->
    <div class="card">
      <h2>Test Area</h2>
      <div id="scrollTarget" class="scroll-area">
        <div class="scroll-area-icon">🖱️ / 🤌</div>
        <p><strong>Scroll / Wheel over this box</strong></p>
        <p style="font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem;">
          Or use simulation buttons below
        </p>
      </div>

      <div class="sim-buttons">
        <button id="simMouseBtn" class="btn">Simulate Mouse</button>
        <button id="simTrackpadBtn" class="btn">Simulate Trackpad</button>
        <button id="resetBtn" class="btn" style="background: #991b1b;">Reset</button>
      </div>
    </div>

    <!-- Output Display -->
    <div class="card">
      <h2>Classifier Output</h2>

      <div style="text-align: center; margin-top: 1rem;">
        <div id="deviceBadge" class="result-badge unknown">
          <span id="deviceIcon">❓</span>
          <span id="deviceText">unknown</span>
        </div>
      </div>

      <h3 style="font-size: 0.9rem; margin-top: 1rem; color: var(--muted);">Classifier Debug Stats</h3>
      <div id="debugInfo" class="debug-info">No wheel events received yet</div>
    </div>
  </div>

  <script type="module">
    import { WheelClassifier } from '../src/index.ts';

    const scrollTarget = document.getElementById('scrollTarget');
    const simMouseBtn = document.getElementById('simMouseBtn');
    const simTrackpadBtn = document.getElementById('simTrackpadBtn');
    const resetBtn = document.getElementById('resetBtn');

    const deviceBadge = document.getElementById('deviceBadge');
    const deviceIcon = document.getElementById('deviceIcon');
    const deviceText = document.getElementById('deviceText');
    const debugInfo = document.getElementById('debugInfo');

    let classifier = new WheelClassifier();

    function updateUI() {
      const device = classifier.inferDeviceType();

      if (!device) {
        deviceBadge.className = 'result-badge unknown';
        deviceIcon.textContent = '❓';
        deviceText.textContent = 'unknown';
        debugInfo.textContent = 'No wheel events received yet';
        return;
      }

      deviceBadge.className = `result-badge ${device}`;
      if (device === 'mouse') {
        deviceIcon.textContent = '🖱️';
      } else if (device === 'trackpad') {
        deviceIcon.textContent = '🤌';
      } else {
        deviceIcon.textContent = '❓';
      }

      deviceText.textContent = device;
      debugInfo.textContent = classifier.debugString();
    }

    scrollTarget.addEventListener('wheel', (e) => {
      classifier.addEvent(e);
      updateUI();
    }, { passive: true });

    simMouseBtn.addEventListener('click', () => {
      const evt = new WheelEvent('wheel', {
        deltaY: 120,
        deltaX: 0,
        deltaMode: WheelEvent.DOM_DELTA_LINE,
        bubbles: true,
      });
      scrollTarget.dispatchEvent(evt);
    });

    simTrackpadBtn.addEventListener('click', () => {
      const evt = new WheelEvent('wheel', {
        deltaY: 2.345,
        deltaX: 0,
        deltaMode: WheelEvent.DOM_DELTA_PIXEL,
        bubbles: true,
      });
      scrollTarget.dispatchEvent(evt);
    });

    resetBtn.addEventListener('click', () => {
      classifier = new WheelClassifier();
      updateUI();
    });

    updateUI();
  </script>
</body>
</html>
